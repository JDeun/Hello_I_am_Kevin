name: Refresh profile

# Regenerates only what needs no judgement: the papers table and the badge that
# counts them, both straight from the arXiv API. Publishing a paper is the only
# step needed to see it on the page.
#
# The open-source table is written by hand -- it carries descriptions, ordering,
# and each project's own release caveat, which are decisions, not data. The audit
# step does not edit it; it fails when a version printed there no longer matches
# PyPI or GitHub, so the drift is reported and a person fixes the wording.
#
# Reads public APIs only -- arXiv, PyPI, GitHub. It has no access to the private
# career vault behind these entries, which holds confidential items; a scheduled
# public job is exactly the wrong place for those.

on:
  schedule:
    - cron: "17 21 * * 1"      # Mondays 06:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No install step: the script is standard library only, so this job cannot
      # break because of a resolver or a yanked package.
      - name: Regenerate papers table and badge
        run: python scripts/update_profile.py

      - name: Commit if anything moved
        run: |
          if git diff --quiet -- README.md README.ko.md; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ko.md
          git commit -m "chore: refresh papers table from arXiv"
          git push

      # Last, and allowed to fail the run: a red check is the notification that a
      # hand-written version has gone stale. Nothing is rewritten automatically.
      - name: Audit hand-written versions
        run: python scripts/update_profile.py --audit
